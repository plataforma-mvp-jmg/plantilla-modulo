# CI del módulo: llama a los controles obligatorios de la plataforma, FIJADOS POR SHA (ADR 0010 de
# plataforma). Este archivo no se edita en el módulo: el SHA lo actualiza Sistemas por PR.
name: ci
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    # plataforma-mvp-jmg/plataforma#24 (I4-4): misma versión de plataforma para controles y publicación
    uses: plataforma-mvp-jmg/plataforma/.github/workflows/modulo-pr.yml@6ab11d8ce9bb724a0ff816b872653d578fec28a7

  publicar:
    # Solo en main (código revisado y con controles en verde): imagen por digest, SBOM, atestaciones
    # y pedido de despliegue a staging, que ejecuta el deployer de Sistemas (ADR 0012 de plataforma).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [controles]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      deployments: write
    uses: plataforma-mvp-jmg/plataforma/.github/workflows/modulo-publicar.yml@6ab11d8ce9bb724a0ff816b872653d578fec28a7

  resumen:
    # Único check requerido por el ruleset: exige que los controles hayan pasado.
    name: resumen
    if: always()
    needs: [controles]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        env:
          RESULTADO: ${{ needs.controles.result }}
        run: |
          echo "controles: $RESULTADO"
          test "$RESULTADO" = "success"
