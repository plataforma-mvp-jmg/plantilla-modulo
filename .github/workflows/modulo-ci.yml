# CI del módulo: llama a los controles obligatorios de la plataforma, FIJADOS POR SHA (ADR 0010 de
# plataforma). Este archivo no se edita en el módulo: el SHA lo actualiza Sistemas por PR.
name: ci
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controles:
    # plataforma-mvp-jmg/plataforma#16 (I3-2)
    uses: plataforma-mvp-jmg/plataforma/.github/workflows/modulo-pr.yml@810b26e9740349f19c3fedcf074f397401da808c

  resumen:
    # Único check requerido por el ruleset: exige que los controles hayan pasado.
    name: resumen
    if: always()
    needs: [controles]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultados
        env:
          RESULTADO: ${{ needs.controles.result }}
        run: |
          echo "controles: $RESULTADO"
          test "$RESULTADO" = "success"
